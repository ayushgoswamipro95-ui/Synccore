<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#000814"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  
  <!-- Inception Folded City Grid -->
  <g opacity="0.4" stroke="#00e5ff" stroke-width="1.5">
    <path d="M 0,150 L 400,150 M 0,220 L 400,220 M 0,280 L 400,280"/>
    <path d="M 50,0 L 50,300 M 120,0 L 120,300 M 200,0 L 200,300 M 280,0 L 280,300 M 350,0 L 350,300"/>
    <path d="M 0,300 Q 200,450 400,300" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <path d="M 0,330 Q 200,480 400,330" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
  </g>

  <!-- Central Totem Spinner -->
  <g transform="translate(200, 320)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.6"/>
    <polygon points="0,-35 15,10 -15,10" fill="#00e5ff" opacity="0.9"/>
    <circle cx="0" cy="18" r="4" fill="#00e5ff"/>
  </g>

  <!-- Movie Title and Badges -->
  <rect x="20" y="440" width="360" height="135" rx="10" fill="rgba(11,15,25,0.85)" stroke="rgba(255,255,255,0.1)"/>
  <text x="35" y="475" fill="#00e5ff" font-family="Inter, sans-serif" font-size="12" font-weight="700" letter-spacing="2">CHRISTOPHER NOLAN</text>
  <text x="35" y="510" fill="#ffffff" font-family="Inter, sans-serif" font-size="26" font-weight="900" letter-spacing="1">INCEPTION</text>
  <text x="35" y="535" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">Sci-Fi / Action &bull; 2h 28m &bull; IMAX 2D</text>
  <text x="35" y="558" fill="#f59e0b" font-family="Inter, sans-serif" font-size="13" font-weight="700">★ 8.8/10 (2.4M Votes)</text>
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncCore — Booking Summary</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <header class="navbar">
        <div class="container nav-content">
            <a href="../index.html" class="brand-logo">
                <span class="brand-dot"></span>
                <span>SyncCore Cinema</span>
            </a>
            <ul class="nav-links">
                <li><a href="../index.html" class="nav-link">Home</a></li>
                <li><a href="my-bookings.html" class="nav-link">My Bookings</a></li>
                <li><a href="admin.html" class="nav-link" style="color: var(--accent-rose); font-weight: 600;">🛡️ Admin</a></li>
            </ul>
        </div>
    </header>

    <main class="container" style="padding-top: 3rem; max-width: 650px; padding-bottom: 5rem;">
        <h1 style="font-size: 2rem; margin-bottom: 1.5rem;">Booking Summary</h1>

        <div class="glass-panel" style="padding: 2rem;">
            <!-- Movie & Schedule Info -->
            <div style="border-bottom: 1px solid var(--border-color); padding-bottom: 1.25rem; margin-bottom: 1.25rem;">
                <h2 style="font-size: 1.4rem; margin-bottom: 0.35rem;" id="summary-movie">Inception: The OS Kernel</h2>
                <p style="color: var(--text-muted); font-size: 0.85rem;" id="summary-show">
                    IMAX Cyberplex &bull; Screen 1 (Laser IMAX) &bull; 15 Oct 2026, 18:00
                </p>
            </div>

            <!-- Seat Breakdown -->
            <div style="display: flex; justify-content: space-between; margin-bottom: 0.75rem;">
                <span style="color: var(--text-secondary);">Reserved Seats:</span>
                <span class="font-mono" style="font-weight: 700; color: var(--accent-cyan);" id="summary-seats">G10, G11</span>
            </div>

            <div style="display: flex; justify-content: space-between; margin-bottom: 0.75rem;">
                <span style="color: var(--text-secondary);">Seat Price Subtotal:</span>
                <span class="font-mono" id="summary-subtotal">₹700.00</span>
            </div>

            <div style="display: flex; justify-content: space-between; margin-bottom: 1.5rem;">
                <span style="color: var(--text-secondary);">Convenience Fee:</span>
                <span class="font-mono">₹45.00</span>
            </div>

            <!-- Authenticated Customer Information Section -->
            <div style="border-top: 1px solid var(--border-color); padding-top: 1.25rem; margin-top: 1.25rem; margin-bottom: 1.5rem;">
                <h3 style="font-size: 0.95rem; margin-bottom: 0.75rem; color: var(--accent-cyan); text-transform: uppercase; letter-spacing: 0.05em;">Customer & Payment Contact</h3>
                
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 0.3rem; display: block;">Full Name *</label>
                    <input type="text" id="cust-name-input" class="form-control" placeholder="Enter your full name" required style="width: 100%;">
                </div>

                <div class="form-group" style="margin-bottom: 1rem;">
                    <label style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 0.3rem; display: block;">Email / Gmail for E-Ticket *</label>
                    <input type="email" id="cust-email-input" class="form-control" placeholder="Enter email address" required style="width: 100%;">
                </div>
            </div>

            <!-- Grand Total -->
            <div style="border-top: 1px solid var(--border-color); padding-top: 1.25rem; display: flex; justify-content: space-between; margin-bottom: 2rem;">
                <span style="font-size: 1.1rem; font-weight: 700;">Grand Total:</span>
                <span class="font-mono" style="font-size: 1.35rem; font-weight: 700; color: var(--accent-emerald);" id="summary-total">₹745.00</span>
            </div>

            <button id="btn-proceed-payment" class="btn btn-primary" style="width: 100%; font-weight: 700; padding: 0.85rem;">
                💳 Proceed to Pay with Razorpay &rarr;
            </button>
        </div>
    </main>

    <div id="toast-container"></div>
    <script src="../js/components/toast.js"></script>
    <script src="../js/components/modal.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/components/navbar.js"></script>
    <script src="../js/booking/booking.js"></script>
</body>
</html>

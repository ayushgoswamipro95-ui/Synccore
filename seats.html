<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncCore Seats — Select Your Seats</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/booking.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <header class="navbar">
        <div class="container nav-content">
            <a href="../index.html" class="brand-logo">
                <span class="brand-dot"></span>
                <span>SyncCore Cinema</span>
            </a>
            <div style="display:flex; align-items:center; gap:1.25rem;">
                <a href="../index.html" class="nav-link">Home</a>
                <a href="my-bookings.html" class="nav-link">My Bookings</a>
                <a href="admin.html" class="nav-link" style="color: var(--accent-rose); font-weight: 600;">🛡️ Admin</a>
                <span class="badge badge-ready font-mono" id="show-badge">Show #101</span>
                <a href="simulation.html" class="btn btn-secondary btn-sm" style="border-color: var(--accent-cyan); color: var(--accent-cyan); font-weight:700;">
                    ⚡ OS Concurrency Simulator
                </a>
            </div>
        </div>
    </header>

    <main class="container booking-container">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h1 style="font-size: 2rem;" id="seat-page-title">Select Your Seats</h1>
            <p style="color: var(--text-secondary); font-size: 0.9rem;" id="seat-page-subtitle">Screen 1 &bull; IMAX Laser Experience</p>
        </div>

        <!-- Cinema Screen Curve -->
        <div class="screen-indicator">
            <div class="screen-curve"></div>
            <div class="screen-label">All eyes this way please</div>
        </div>

        <!-- Interactive Cinema Seat Grid -->
        <div class="seat-grid" id="seat-layout-grid">
            <!-- Dynamically populated by seat.js -->
        </div>

        <!-- Seat Legend -->
        <div class="seat-legend">
            <div class="legend-item"><div class="seat available" style="width:20px;height:20px;"></div> Available</div>
            <div class="legend-item"><div class="seat selected" style="width:20px;height:20px;"></div> Selected</div>
            <div class="legend-item"><div class="seat locked" style="width:20px;height:20px;"></div> Locked (Contention)</div>
            <div class="legend-item"><div class="seat booked" style="width:20px;height:20px;"></div> Booked</div>
        </div>

        <!-- Checkout Action Bar -->
        <div class="glass-panel" style="max-width: 650px; margin: 3rem auto 0 auto; padding: 1.5rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;">
            <div>
                <div style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase;">Selected Seats</div>
                <div id="selected-seats-display" class="font-mono" style="font-size: 1.1rem; font-weight: 700; color: var(--accent-cyan);">None</div>
            </div>
            <div>
                <div style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase;">Total Amount</div>
                <div id="total-price-display" class="font-mono" style="font-size: 1.25rem; font-weight: 700;">₹0.00</div>
            </div>
            <button id="btn-proceed-booking" class="btn btn-primary" disabled>Proceed to Summary &rarr;</button>
        </div>
    </main>

    <div id="toast-container"></div>
    <script src="../js/components/toast.js"></script>
    <script src="../js/components/modal.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/components/navbar.js"></script>
    <script src="../js/booking/seat.js"></script>
</body>
</html>

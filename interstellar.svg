<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="space" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="gargantua" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#b45309" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="600" fill="url(#space)"/>

  <!-- Gargantua Black Hole Glow & Accretion Disk -->
  <circle cx="200" cy="220" r="140" fill="url(#gargantua)"/>
  <ellipse cx="200" cy="220" rx="160" ry="25" fill="none" stroke="#fef08a" stroke-width="4" opacity="0.8"/>
  <ellipse cx="200" cy="220" rx="175" ry="45" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.5"/>
  <circle cx="200" cy="220" r="55" fill="#000000"/>
  <circle cx="200" cy="220" r="56" fill="none" stroke="#fef08a" stroke-width="2"/>

  <!-- Stars -->
  <circle cx="60" cy="80" r="1.5" fill="#fff" opacity="0.8"/>
  <circle cx="340" cy="110" r="2" fill="#fff" opacity="0.9"/>
  <circle cx="90" cy="320" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="310" cy="340" r="1.5" fill="#fff" opacity="0.7"/>

  <!-- Movie Title Card -->
  <rect x="20" y="440" width="360" height="135" rx="10" fill="rgba(11,15,25,0.85)" stroke="rgba(255,255,255,0.1)"/>
  <text x="35" y="475" fill="#f59e0b" font-family="Inter, sans-serif" font-size="12" font-weight="700" letter-spacing="2">MANKIND WAS BORN ON EARTH</text>
  <text x="35" y="510" fill="#ffffff" font-family="Inter, sans-serif" font-size="25" font-weight="900" letter-spacing="1">INTERSTELLAR</text>
  <text x="35" y="535" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">Sci-Fi / Adventure &bull; 2h 49m &bull; IMAX 70mm</text>
  <text x="35" y="558" fill="#f59e0b" font-family="Inter, sans-serif" font-size="13" font-weight="700">★ 8.7/10 (2.1M Votes)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="night" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#1e3a8a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="600" fill="url(#night)"/>
  
  <!-- Moonlight Sphere -->
  <circle cx="200" cy="200" r="110" fill="url(#moon)"/>

  <!-- Bat Insignia Silhouette -->
  <path d="M 200,165 Q 215,140 230,175 Q 260,155 285,185 Q 270,215 240,225 Q 225,255 200,245 Q 175,255 160,225 Q 130,215 115,185 Q 140,155 170,175 Q 185,140 200,165 Z" fill="#ffffff" opacity="0.9"/>

  <!-- City Silhouette in background -->
  <rect x="30" y="290" width="40" height="150" fill="#0f172a"/>
  <rect x="90" y="240" width="55" height="200" fill="#090d16"/>
  <rect x="170" y="270" width="60" height="170" fill="#0f172a"/>
  <rect x="250" y="230" width="50" height="210" fill="#090d16"/>
  <rect x="320" y="280" width="50" height="160" fill="#0f172a"/>

  <!-- Movie Title Card -->
  <rect x="20" y="440" width="360" height="135" rx="10" fill="rgba(11,15,25,0.85)" stroke="rgba(255,255,255,0.1)"/>
  <text x="35" y="475" fill="#60a5fa" font-family="Inter, sans-serif" font-size="12" font-weight="700" letter-spacing="2">WHY SO SERIOUS?</text>
  <text x="35" y="510" fill="#ffffff" font-family="Inter, sans-serif" font-size="25" font-weight="900" letter-spacing="1">THE DARK KNIGHT</text>
  <text x="35" y="535" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">Action / Crime &bull; 2h 32m &bull; IMAX 2D</text>
  <text x="35" y="558" fill="#f59e0b" font-family="Inter, sans-serif" font-size="13" font-weight="700">★ 9.0/10 (2.9M Votes)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="cyber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="60%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#cyber)"/>

  <!-- Matrix Digital Rain Stream Lines -->
  <g opacity="0.7" fill="#10b981" font-family="Courier, monospace" font-size="13" font-weight="bold">
    <text x="40" y="50">0 1 0 1 0</text>
    <text x="40" y="80">1 1 0 0 1</text>
    <text x="40" y="110">F O R K ( )</text>
    <text x="120" y="70">E X E C ( )</text>
    <text x="120" y="100">0 1 1 0</text>
    <text x="120" y="130">M U T E X</text>
    <text x="200" y="40">S Y N C</text>
    <text x="200" y="70">1 0 1 0 1</text>
    <text x="200" y="100">W A I T</text>
    <text x="280" y="60">0 1 0 1</text>
    <text x="280" y="90">L O C K</text>
    <text x="340" y="80">A C I D</text>
  </g>

  <!-- Glowing Binary Eye -->
  <circle cx="200" cy="230" r="60" fill="none" stroke="#10b981" stroke-width="3" opacity="0.8"/>
  <circle cx="200" cy="230" r="30" fill="rgba(16,185,129,0.3)" stroke="#34d399" stroke-width="2"/>
  <circle cx="200" cy="230" r="10" fill="#6ee7b7"/>

  <!-- Movie Title Card -->
  <rect x="20" y="440" width="360" height="135" rx="10" fill="rgba(11,15,25,0.85)" stroke="rgba(255,255,255,0.1)"/>
  <text x="35" y="475" fill="#34d399" font-family="Inter, sans-serif" font-size="12" font-weight="700" letter-spacing="2">THE WACHOWSKIS</text>
  <text x="35" y="510" fill="#ffffff" font-family="Inter, sans-serif" font-size="26" font-weight="900" letter-spacing="1">THE MATRIX</text>
  <text x="35" y="535" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">Action / Sci-Fi &bull; 2h 16m &bull; 4DX 3D</text>
  <text x="35" y="558" fill="#f59e0b" font-family="Inter, sans-serif" font-size="13" font-weight="700">★ 8.7/10 (2.0M Votes)</text>
</svg>
